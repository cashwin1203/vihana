<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>U&I Vihana — Volunteer Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground:      #F7F6F3;
      --surface:     #FFFFFF;
      --ink:         #37352F;
      --ink-2:       #787774;
      --ink-3:       #AEABA6;
      --line:        #E9E9E7;
      --line-hi:     #D3D1CB;
      --red:         #CC1100;
      --mint-bg:     #E4F4F1;
      --mint-border: #B8E0D9;
      --mint-ink:    #0F6B5C;
      --peach-bg:    #FFEDD5;
      --peach-border:#F5D7A8;
      --peach-ink:   #92400E;
      --rose-bg:     #FCE7F3;
      --rose-border: #F0ABCF;
      --rose-ink:    #9D174D;
      --serif: 'Source Serif 4', Georgia, serif;
      --sans:  'Inter', system-ui, sans-serif;
      --mono:  'JetBrains Mono', monospace;
      --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
      --shadow-sm:   0 1px 3px rgba(15,15,15,0.04), 0 1px 2px rgba(15,15,15,0.06);
      --shadow-md:   0 4px 12px rgba(15,15,15,0.06), 0 2px 4px rgba(15,15,15,0.04);
      --shadow-lift: 0 8px 24px rgba(15,15,15,0.08), 0 2px 8px rgba(15,15,15,0.04);
    }
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ground); color: var(--ink);
      font-family: var(--sans); font-size: 15px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh; padding: 24px 16px 48px;
      display: flex; justify-content: center;
    }
    .wrap { width: 100%; max-width: 440px; }

    /* HEADER */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand  { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 30px; height: 30px; border-radius: 6px; object-fit: cover;
      flex-shrink: 0; border: 1px solid var(--line); box-shadow: var(--shadow-sm);
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand-name { font-family: var(--mono); font-size: 0.68rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--red); }
    .brand-sub  { font-size: 0.72rem; color: var(--ink-2); }
    .clock      { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-3); text-align: right; }

    /* TABS */
    .tabs {
      display: flex; gap: 2px; padding: 3px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-lg); margin-bottom: 20px; box-shadow: var(--shadow-sm);
    }
    .tab-btn {
      flex: 1; min-height: 36px; padding: 6px 12px;
      background: transparent; border: none; border-radius: 9px;
      color: var(--ink-2); font-family: var(--sans); font-size: 0.82rem;
      font-weight: 500; cursor: pointer; transition: all 0.18s ease;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { background: var(--ground); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }

    /* BLOCK CARD */
    .block {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-lg); padding: 20px; margin-bottom: 12px;
      box-shadow: var(--shadow-sm); transition: box-shadow 0.2s ease;
    }
    .page-header { margin-bottom: 10px; }
    .page-title {
      font-family: var(--serif); font-size: 1.75rem; font-weight: 500;
      letter-spacing: -0.02em; line-height: 1.2; color: var(--ink);
      margin-bottom: 10px;
    }

    /* SESSION CHIP */
    .session-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 9999px;
      font-size: 0.70rem; font-weight: 500; letter-spacing: 0.02em;
    }
    .chip-open   { background: var(--mint-bg); border: 1px solid var(--mint-border); color: var(--mint-ink); }
    .chip-closed { background: var(--surface);  border: 1px solid var(--line);        color: var(--ink-2);    }
    .chip-dot    { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .chip-open .chip-dot { animation: pulse 2s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .section-label {
      font-size: 0.72rem; font-weight: 600; color: var(--ink-2);
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px;
    }

    /* INPUTS */
    .search {
      width: 100%; min-height: 40px; padding: 9px 12px;
      background: var(--ground); border: 1px solid var(--line);
      border-radius: var(--r-md); color: var(--ink); font-family: var(--sans);
      font-size: 0.88rem; outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      margin-bottom: 12px;
    }
    .search::placeholder { color: var(--ink-3); }
    .search:focus { border-color: var(--line-hi); background: var(--surface); box-shadow: 0 0 0 3px rgba(55,53,47,0.06); }
    select.search { cursor: pointer; appearance: none; }

    /* FILTER PILLS */
    .pills { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      flex: 0 0 auto; min-height: 30px; padding: 3px 10px;
      background: transparent; border: 1px solid var(--line); border-radius: 9999px;
      font-size: 0.72rem; font-weight: 500; color: var(--ink-2); cursor: pointer;
      transition: all 0.15s ease; font-family: var(--sans); white-space: nowrap;
    }
    .pill:hover  { background: var(--ground); color: var(--ink); border-color: var(--line-hi); }
    .pill.active { background: var(--ink); border-color: var(--ink); color: #FFF; font-weight: 600; }

    /* ROSTER */
    .roster-list {
      max-height: 310px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 4px;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    .roster-item {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 46px; padding: 10px 13px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-md); cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .roster-item:hover  { transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--line-hi); }
    .roster-item:active { transform: translateY(0);    box-shadow: var(--shadow-sm); }
    .item-left   { display: flex; align-items: center; gap: 10px; }
    .item-avatar {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--ground); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 600; color: var(--ink-2); flex-shrink: 0;
    }
    .item-name   { font-size: 0.88rem; font-weight: 500; color: var(--ink); }
    .item-right  { display: flex; align-items: center; gap: 7px; }
    .role-tag    { font-size: 0.66rem; font-weight: 500; padding: 2px 7px; border-radius: 4px; }
    .tag-vol     { background: var(--mint-bg);  border: 1px solid var(--mint-border);  color: var(--mint-ink); }
    .tag-stu     { background: var(--peach-bg); border: 1px solid var(--peach-border); color: var(--peach-ink); }
    .item-action { font-size: 0.75rem; color: var(--ink-3); transition: color 0.15s; }
    .roster-item:hover .item-action { color: var(--ink-2); }
    .item-done   { font-size: 0.75rem; color: var(--mint-ink); font-weight: 500; }
    .add-link    { display: block; text-align: center; margin-top: 14px; font-size: 0.76rem; color: var(--ink-3); text-decoration: none; transition: color 0.15s; }
    .add-link:hover { color: var(--ink-2); }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; min-height: 42px; padding: 10px 16px;
      border-radius: var(--r-md); font-family: var(--sans); font-size: 0.88rem;
      font-weight: 500; cursor: pointer; transition: all 0.18s ease; border: none;
    }
    .btn + .btn { margin-top: 8px; }
    .btn-primary { background: var(--ink); color: #FFF; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: #1a1915; transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
    .btn-ghost:hover { background: var(--ground); border-color: var(--line-hi); color: var(--ink); }
    .btn-ai { background: var(--ground); border: 1px solid var(--line); color: var(--ink); font-size: 0.84rem; }
    .btn-ai:hover { background: var(--surface); border-color: var(--line-hi); transform: translateY(-1px); box-shadow: var(--shadow-md); }

    /* SUCCESS */
    .success-box { text-align: center; padding: 28px 16px 8px; animation: fadeUp 0.28s cubic-bezier(0.22,1,0.36,1) forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .check-ring  { width: 56px; height: 56px; margin: 0 auto 16px; }
    .check-circle { stroke-dasharray:157; stroke-dashoffset:157; stroke-width:1.5; stroke:var(--mint-ink); fill:none; animation:drawC 0.4s ease-out forwards; }
    .check-tick   { stroke-dasharray:40;  stroke-dashoffset:40;  stroke:var(--mint-ink); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; fill:none; animation:drawT 0.25s ease-out 0.25s forwards; }
    @keyframes drawC { to{stroke-dashoffset:0} }
    @keyframes drawT { to{stroke-dashoffset:0} }
    .success-name { font-family:var(--serif); font-size:1.45rem; font-weight:500; letter-spacing:-0.02em; color:var(--ink); margin-bottom:8px; }
    .time-pill    { display:inline-block; background:var(--mint-bg); border:1px solid var(--mint-border); color:var(--mint-ink); padding:3px 12px; border-radius:9999px; font-size:0.76rem; font-weight:500; margin-bottom:22px; }

    /* DIVIDER */
    .divider { height:1px; background:var(--line); margin:16px 0; }

    /* LEADER */
    .dash-header { font-family:var(--serif); font-size:1.2rem; font-weight:500; letter-spacing:-0.02em; color:var(--ink); margin-bottom:14px; }
    .pin-block   { background:var(--ground); border:1px solid var(--line); border-radius:var(--r-md); padding:16px; }
    .kpi-grid    { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .kpi-cell    { background:var(--ground); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 13px; transition:transform 0.18s ease, box-shadow 0.18s ease; }
    .kpi-cell:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
    .kpi-val     { font-family:var(--serif); font-size:1.9rem; font-weight:500; color:var(--ink); line-height:1; margin-bottom:3px; }
    .kpi-val.accent { color:var(--red); }
    .kpi-label   { font-size:0.67rem; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-2); }
    .anomaly-banner { background:var(--rose-bg); border:1px solid var(--rose-border); border-radius:var(--r-md); padding:10px 13px; margin-bottom:14px; font-size:0.80rem; color:var(--rose-ink); animation:fadeUp 0.22s ease forwards; }
    .anomaly-banner p { margin-top:3px; font-size:0.73rem; color:var(--ink-2); }
    .risk-list   { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .risk-item   { display:flex; flex-direction:column; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 13px; transition:transform 0.18s ease, box-shadow 0.18s ease; }
    .risk-item:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
    .risk-row    { display:flex; align-items:center; justify-content:space-between; }
    .risk-name   { font-size:0.88rem; font-weight:500; color:var(--ink); }
    .risk-badge  { font-size:0.65rem; font-weight:500; padding:2px 8px; border-radius:4px; }
    .badge-high  { background:var(--rose-bg);  border:1px solid var(--rose-border);  color:var(--rose-ink); }
    .badge-mod   { background:var(--peach-bg); border:1px solid var(--peach-border); color:var(--peach-ink); }
    .risk-reason { font-size:0.73rem; color:var(--ink-2); }
    .ai-summary-box { background:var(--ground); border:1px solid var(--line); border-radius:var(--r-md); padding:14px; margin-top:10px; font-size:0.82rem; line-height:1.7; color:var(--ink); white-space:pre-wrap; animation:fadeUp 0.22s ease forwards; }
    .empty       { text-align:center; padding:28px 0; color:var(--ink-3); font-size:0.84rem; }
    :focus-visible { outline:2px solid var(--red); outline-offset:2px; }
    @media (prefers-reduced-motion:reduce) { *,::before,::after { animation-duration:0.01ms!important; transition-duration:0.01ms!important; } }
  </style>
</head>
<body>
<div class="wrap" role="main">

  <header class="header">
    <div class="brand">
      <img src="<?= logoDataUrl ?>" alt="U&I Logo" class="brand-logo"
           style="<?= logoDataUrl ? '' : 'display:none;' ?>">
      <div class="brand-text">
        <span class="brand-name">U&amp;I India</span>
        <span class="brand-sub">Vihana Centre</span>
      </div>
    </div>
    <div class="clock" id="liveClock">--</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" id="tabVol"  role="tab" aria-selected="true"  onclick="switchTab('VOL')">Volunteer</button>
    <button class="tab-btn"        id="tabLead" role="tab" aria-selected="false" onclick="switchTab('LEAD')">Leader View</button>
  </div>

  <!-- VOLUNTEER PANEL -->
  <section id="volPanel" role="region" aria-label="Volunteer check-in">
    <div class="page-header">
      <h1 class="page-title">&#x1F4CB; Volunteer Attendance</h1>
      <span class="session-chip chip-closed" id="sessionBadge">
        <span class="chip-dot"></span>
        <span id="sessionLabel">Loading&hellip;</span>
      </span>
    </div>

    <div class="block" id="volunteerMode">
      <input type="text" id="searchInput" class="search" placeholder="Search by name&hellip;"
             oninput="filterRoster()" aria-label="Search roster">
      <div class="pills" role="tablist">
        <button class="pill active" id="pillAll"     role="tab" aria-selected="true"  onclick="setFilter('ALL')">All <span id="cntAll">0</span></button>
        <button class="pill"        id="pillVol"     role="tab" aria-selected="false" onclick="setFilter('VOLUNTEER')">Volunteers <span id="cntVol">0</span></button>
        <button class="pill"        id="pillStu"     role="tab" aria-selected="false" onclick="setFilter('STUDENT')">Students <span id="cntStu">0</span></button>
        <button class="pill"        id="pillChecked" role="tab" aria-selected="false" onclick="setFilter('CHECKED_IN')">Checked-In <span id="cntChecked">0</span></button>
      </div>
      <div class="roster-list" id="rosterList" role="list">
        <div class="empty">Loading roster&hellip;</div>
      </div>
      <a href="#" class="add-link" onclick="showNewPersonForm();return false;">Not on the list? Add yourself &rarr;</a>
    </div>

    <div class="block" id="successMode" style="display:none;" role="dialog" aria-modal="true">
      <div class="success-box">
        <div class="check-ring">
          <svg viewBox="0 0 52 52" aria-hidden="true">
            <circle class="check-circle" cx="26" cy="26" r="25"/>
            <path   class="check-tick"   d="M14 27l8 8 17-17"/>
          </svg>
        </div>
        <div class="success-name" id="successName">Checked In</div>
        <div class="time-pill"    id="successTime">--:--</div>
        <button class="btn btn-primary" onclick="resetCheckIn()">Done &mdash; Next Check-In</button>
        <button class="btn btn-ghost"   onclick="resetCheckIn()">Back to Roster</button>
      </div>
    </div>

    <div class="block" id="newPersonMode" style="display:none;" role="dialog" aria-modal="true">
      <h2 style="font-family:var(--serif);font-size:1.2rem;font-weight:500;letter-spacing:-0.02em;margin-bottom:14px;">First-Time Registration</h2>
      <input type="text" id="newNameInput"  class="search" placeholder="Full Name">
      <select           id="newRoleSelect" class="search">
        <option value="VOLUNTEER">Volunteer</option>
        <option value="STUDENT">Student</option>
      </select>
      <button class="btn btn-primary" onclick="submitNewPerson()">Add &amp; Check In</button>
      <button class="btn btn-ghost"   onclick="cancelNewPerson()">Cancel</button>
    </div>
  </section>

  <!-- LEADER PANEL -->
  <section id="leadPanel" style="display:none;" role="region" aria-label="Leader dashboard">
    <div class="block">
      <h2 class="dash-header">&#x1F4CA; Centre Dashboard</h2>
      <div class="pin-block" id="leaderPinSection">
        <input type="password" id="pinInput" class="search" placeholder="Leader PIN" style="margin-bottom:8px;">
        <button class="btn btn-primary" onclick="loadLeaderData()">Access Dashboard</button>
      </div>
      <div id="leaderContent" style="display:none;">
        <div id="anomalyContainer" role="status" aria-live="polite"></div>
        <div class="kpi-grid">
          <div class="kpi-cell"><div class="kpi-val" id="kpiCheckedIn">0</div><div class="kpi-label">Today In</div></div>
          <div class="kpi-cell"><div class="kpi-val" id="kpiTotalVols">0</div><div class="kpi-label">Active Roster</div></div>
          <div class="kpi-cell"><div class="kpi-val" id="kpiTurnoutPct">0%</div><div class="kpi-label">Turnout</div></div>
          <div class="kpi-cell"><div class="kpi-val accent" id="kpiAtRisk">0</div><div class="kpi-label">At Risk</div></div>
        </div>
        <div class="divider"></div>
        <p class="section-label">Attrition Watchlist</p>
        <div class="risk-list" id="riskList"></div>
        <div class="divider"></div>
        <p class="section-label">Session Summary</p>
        <button class="btn btn-ai" onclick="generateGeminiSummary()">Generate Executive Summary</button>
        <div id="aiSummaryBox" style="display:none;">
          <div class="ai-summary-box" id="aiSummaryContent"></div>
          <button id="copyAiBtn" class="btn btn-ghost" onclick="copyAiSummary()" style="margin-top:8px;font-size:0.78rem;">Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </section>

</div>
<script>
  var gData=null, currentFilter='ALL', lastAiText='';

  /* CLOCK */
  (function(){
    var el=document.getElementById('liveClock');
    function upd(){
      var n=new Date();
      var d=n.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
      var t=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
      el.textContent=d+'  '+t;
    }
    upd(); setInterval(upd,1000);
  })();

  /* TABS */
  function switchTab(tab){
    var v=tab==='VOL';
    document.getElementById('tabVol').className ='tab-btn'+(v?' active':'');
    document.getElementById('tabLead').className='tab-btn'+(!v?' active':'');
    document.getElementById('tabVol').setAttribute('aria-selected',v);
    document.getElementById('tabLead').setAttribute('aria-selected',!v);
    document.getElementById('volPanel').style.display =v?'block':'none';
    document.getElementById('leadPanel').style.display=!v?'block':'none';
  }

  /* COUNTER */
  function animateCounter(id,target,suffix){
    suffix=suffix||'';
    var el=document.getElementById(id); if(!el)return;
    var n=parseFloat(target)||0, dur=600, t0=null;
    requestAnimationFrame(function step(ts){
      if(!t0)t0=ts;
      var p=Math.min((ts-t0)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(n*e)+suffix;
      if(p<1)requestAnimationFrame(step); else el.textContent=n+suffix;
    });
  }

  /* LOAD */
  window.onload=function(){
    if(typeof google!=='undefined'&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(onDataLoaded).getInitialData();
    } else {
      onDataLoaded({
        session:{isOpen:true,startTime:'16:00',endTime:'18:00'},
        checkedInIds:['p1'],
        roster:[
          {id:'p1',name:'Gomesh',role:'VOLUNTEER'},
          {id:'p2',name:'Aarav Sharma',role:'VOLUNTEER'},
          {id:'p3',name:'Priya Patel',role:'STUDENT'},
          {id:'p4',name:'Rohan Kumar',role:'STUDENT'},
          {id:'p5',name:'Neha Verma',role:'VOLUNTEER'}
        ]
      });
    }
  };

  function onDataLoaded(data){
    gData=data;
    var badge=document.getElementById('sessionBadge'), label=document.getElementById('sessionLabel');
    if(data.session&&data.session.isOpen){
      badge.className='session-chip chip-open';
      label.textContent='Open \u00B7 '+data.session.startTime+'\u2013'+data.session.endTime;
    } else if(data.session&&data.session.isEarly){
      badge.className='session-chip chip-closed';
      label.textContent='Opens at '+(data.session.windowStartFormatted||data.session.startTime);
    } else {
      badge.className='session-chip chip-closed';
      label.textContent='Check-In Closed';
    }
    updateCounts(); filterRoster();
  }

  /* ROSTER */
  function updateCounts(){
    if(!gData||!gData.roster)return;
    var r=gData.roster, ci=gData.checkedInIds||[];
    document.getElementById('cntAll').textContent=r.length;
    document.getElementById('cntVol').textContent=r.filter(function(p){return p.role==='VOLUNTEER';}).length;
    document.getElementById('cntStu').textContent=r.filter(function(p){return p.role==='STUDENT';}).length;
    document.getElementById('cntChecked').textContent=r.filter(function(p){return ci.indexOf(p.id)>-1;}).length;
  }

  function setFilter(f){
    currentFilter=f;
    ['pillAll','pillVol','pillStu','pillChecked'].forEach(function(id){
      document.getElementById(id).classList.remove('active');
      document.getElementById(id).setAttribute('aria-selected','false');
    });
    var map={ALL:'pillAll',VOLUNTEER:'pillVol',STUDENT:'pillStu',CHECKED_IN:'pillChecked'};
    var el=document.getElementById(map[f]);
    if(el){el.classList.add('active');el.setAttribute('aria-selected','true');}
    filterRoster();
  }

  function filterRoster(){
    if(!gData||!gData.roster)return;
    var q=document.getElementById('searchInput').value.toLowerCase();
    var list=gData.roster.slice();
    if(currentFilter==='VOLUNTEER') list=list.filter(function(p){return p.role==='VOLUNTEER';});
    else if(currentFilter==='STUDENT') list=list.filter(function(p){return p.role==='STUDENT';});
    else if(currentFilter==='CHECKED_IN') list=list.filter(function(p){return(gData.checkedInIds||[]).indexOf(p.id)>-1;});
    if(q) list=list.filter(function(p){return p.name.toLowerCase().indexOf(q)>-1;});
    renderRoster(list);
  }

  function initials(name){return name.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();}

  function renderRoster(list){
    var el=document.getElementById('rosterList');
    if(!list||list.length===0){el.innerHTML='<div class="empty">No matching members.</div>';return;}
    var ci=(gData&&gData.checkedInIds)?gData.checkedInIds:[];
    el.innerHTML=list.map(function(p){
      var ck=ci.indexOf(p.id)>-1;
      var tc=p.role==='STUDENT'?'tag-stu':'tag-vol';
      var tl=p.role==='STUDENT'?'Student':'Volunteer';
      return '<div class="roster-item" role="listitem" tabindex="0"'+
        ' onclick="doCheckIn(\''+p.id+'\')"'+
        ' onkeydown="if(event.key===\'Enter\')doCheckIn(\''+p.id+'\')">'+
        '<div class="item-left">'+
        '<div class="item-avatar">'+initials(p.name)+'</div>'+
        '<span class="item-name">'+p.name+'</span></div>'+
        '<div class="item-right">'+
        '<span class="role-tag '+tc+'">'+tl+'</span>'+
        '<span class="'+(ck?'item-done':'item-action')+'">'+(ck?'\u2713':'\u2192')+'</span>'+
        '</div></div>';
    }).join('');
  }

  /* CHECK-IN */
  function doCheckIn(id){
    var t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    var show=function(name,time){
      document.getElementById('volunteerMode').style.display='none';
      document.getElementById('successMode').style.display='block';
      document.getElementById('successName').textContent=name;
      document.getElementById('successTime').textContent='Checked in at '+time;
      if(gData&&gData.checkedInIds&&gData.checkedInIds.indexOf(id)<0)gData.checkedInIds.push(id);
      updateCounts();
    };
    if(typeof google!=='undefined'&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(function(r){
        if(r.success)show(r.personName,r.time||t); else alert(r.reason||'Check-in failed.');
      }).checkIn(id);
    } else {
      var p=gData.roster.filter(function(r){return r.id===id;})[0];
      show(p?p.name:'Volunteer',t);
    }
  }

  function resetCheckIn(){
    document.getElementById('successMode').style.display='none';
    document.getElementById('volunteerMode').style.display='block';
    document.getElementById('searchInput').value='';
    setFilter('ALL');
  }

  /* NEW PERSON */
  function showNewPersonForm(){
    document.getElementById('volunteerMode').style.display='none';
    document.getElementById('newPersonMode').style.display='block';
  }
  function cancelNewPerson(){
    document.getElementById('newPersonMode').style.display='none';
    document.getElementById('volunteerMode').style.display='block';
  }
  function submitNewPerson(){
    var name=document.getElementById('newNameInput').value.trim();
    var role=document.getElementById('newRoleSelect').value;
    if(!name){alert('Please enter your name.');return;}
    var t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    if(typeof google!=='undefined'&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(function(r){
        if(r.success){
          document.getElementById('newPersonMode').style.display='none';
          document.getElementById('successMode').style.display='block';
          document.getElementById('successName').textContent=r.personName;
          document.getElementById('successTime').textContent='Added & checked in at '+(r.time||t);
        } else alert(r.reason);
      }).registerNewPerson(name,role);
    } else {
      var nid='p_'+Date.now();
      gData.roster.push({id:nid,name:name,role:role});
      if(!gData.checkedInIds)gData.checkedInIds=[];
      gData.checkedInIds.push(nid);
      document.getElementById('newPersonMode').style.display='none';
      document.getElementById('successMode').style.display='block';
      document.getElementById('successName').textContent=name;
      document.getElementById('successTime').textContent='Added & checked in at '+t;
      updateCounts();
    }
  }

  /* LEADER */
  function loadLeaderData(){
    var pin=document.getElementById('pinInput').value;
    var render=function(stats,anomaly,risks){
      document.getElementById('leaderPinSection').style.display='none';
      document.getElementById('leaderContent').style.display='block';
      setTimeout(function(){animateCounter('kpiCheckedIn', stats.todayCheckedIn||0);},0);
      setTimeout(function(){animateCounter('kpiTotalVols', stats.totalVolunteers||0);},60);
      setTimeout(function(){animateCounter('kpiTurnoutPct',stats.turnOutPct||0,'%');},120);
      setTimeout(function(){animateCounter('kpiAtRisk',    risks?risks.length:0);},180);
      var pct=stats.turnOutPct||0, isLow=pct<60||(anomaly&&anomaly.isAnomaly);
      var aEl=document.getElementById('anomalyContainer');
      if(isLow){
        aEl.innerHTML='<div class="anomaly-banner"><strong>Low Turnout &mdash; '+pct+'% (below 60% threshold)</strong><p>Coordinator review recommended before session ends.</p></div>';
      } else aEl.innerHTML='';
      var rEl=document.getElementById('riskList');
      if(!risks||risks.length===0){
        rEl.innerHTML='<div class="empty" style="color:var(--mint-ink)">All volunteers within healthy attendance range.</div>';
      } else {
        rEl.innerHTML=risks.map(function(item){
          var hi=(item.consecutiveAbsences||0)>=3||(item.riskReason&&item.riskReason.toUpperCase().indexOf('HIGH')>-1);
          return '<div class="risk-item"><div class="risk-row"><span class="risk-name">'+item.name+'</span>'+
            '<span class="risk-badge '+(hi?'badge-high':'badge-mod')+'">'+(hi?'High Risk':'Moderate')+'</span></div>'+
            '<div class="risk-reason">'+(item.riskReason||'Attendance below threshold')+'</div></div>';
        }).join('');
      }
    };
    if(typeof google!=='undefined'&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(function(r){
        if(r.success)render(r.stats,r.anomalyAlert,r.atRiskList); else alert(r.reason);
      }).getLeaderDashboard(pin);
    } else {
      render({todayCheckedIn:6,totalVolunteers:12,turnOutPct:54},{isAnomaly:true},[
        {name:'Aarav Sharma',riskReason:'Missed 3 consecutive sessions'},
        {name:'Neha Verma',riskReason:'Attendance dropped 35% over 4 weeks'}
      ]);
    }
  }

  /* GEMINI */
  function generateGeminiSummary(){
    var pin=document.getElementById('pinInput').value;
    var box=document.getElementById('aiSummaryBox'), content=document.getElementById('aiSummaryContent');
    box.style.display='block'; content.textContent='Generating summary\u2026';
    var show=function(text){lastAiText=text;content.textContent=text;};
    if(typeof google!=='undefined'&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(function(r){
        if(r.success)show(r.aiSummary); else show('Notice: '+r.reason);
      }).generateGeminiExecutiveSummary(pin);
    } else {
      show('Engagement Overview:\n\u2014 Vihana Centre: 12 volunteers, 45 students.\n\u2014 Today\u2019s turnout: 6 of 12 (54%) \u2014 below target.\n\nRetention Watchlist:\n\u2014 2 volunteers flagged for attendance concerns.\n\u2014 Personal outreach recommended.\n\nAction Items:\n\u2014 Follow up with flagged volunteers by end of week.\n\u2014 Review schedule for recurring low-turnout slots.');
    }
  }

  function copyAiSummary(){
    if(!lastAiText)return;
    navigator.clipboard.writeText(lastAiText).then(function(){
      var btn=document.getElementById('copyAiBtn');
      btn.textContent='Copied \u2713';
      setTimeout(function(){btn.textContent='Copy to Clipboard';},2000);
    });
  }
</script>
</body>
</html>

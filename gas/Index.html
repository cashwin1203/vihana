<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>U&I Vihana — Volunteer Attendance</title>

  <!-- DM Sans: precision UI workhorse. JetBrains Mono: data/codes only. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ─────────────────────────────────────────────────────────────
       DESIGN TOKENS — brand-derived, no rainbow, 2 neutrals max
    ───────────────────────────────────────────────────────────── */
    :root {
      /* Brand */
      --red:        #CC1100;
      --red-dim:    rgba(204, 17, 0, 0.14);
      --red-border: rgba(204, 17, 0, 0.30);
      --red-hover:  #aa0e00;

      /* Canvas */
      --bg:         #0A0A0A;
      --surface:    #111111;
      --elevated:   #181818;

      /* Borders */
      --line:       rgba(255, 255, 255, 0.09);
      --line-hi:    rgba(255, 255, 255, 0.16);

      /* Text */
      --text:       #F2F2F2;
      --muted:      #7A7A7A;
      --faint:      #3D3D3D;

      /* Risk — derived from red, no new hues */
      --risk-hi-bg:     rgba(204, 17, 0, 0.12);
      --risk-hi-border: rgba(204, 17, 0, 0.28);
      --risk-hi-text:   #F87171;

      --risk-md-bg:     rgba(204, 100, 0, 0.10);
      --risk-md-border: rgba(204, 100, 0, 0.24);
      --risk-md-text:   #FDBA74;

      /* Confirm green — single semantic exception */
      --green:      #22C55E;
      --green-dim:  rgba(34, 197, 94, 0.10);
      --green-border: rgba(34, 197, 94, 0.22);

      /* Typography */
      --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;

      /* Geometry */
      --r: 4px;   /* tool-like — not rounded-app-card */
      --r-lg: 6px;
    }

    /* ─────────────────────────────────────────────────────────────
       RESET + BASE
    ───────────────────────────────────────────────────────────── */
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      padding: 20px 16px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .wrap {
      width: 100%;
      max-width: 432px;
    }

    /* ─────────────────────────────────────────────────────────────
       HEADER
    ───────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--line-hi);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-name {
      font-family: var(--mono);
      font-size: 0.70rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--red);
    }

    .brand-sub {
      font-size: 0.70rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .clock {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    /* ─────────────────────────────────────────────────────────────
       PAGE TITLE BLOCK
    ───────────────────────────────────────────────────────────── */
    .title-block {
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
      text-wrap: balance;
      margin-bottom: 10px;
    }

    /* Session status chip — minimal, no dot animation */
    .session-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .chip-open {
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      color: var(--green);
    }

    .chip-closed {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .chip-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ─────────────────────────────────────────────────────────────
       CARD
    ───────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 20px;
      margin-bottom: 12px;
    }

    /* ─────────────────────────────────────────────────────────────
       SEARCH INPUT
    ───────────────────────────────────────────────────────────── */
    .search {
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      background: var(--elevated);
      border: 1px solid var(--line);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
      margin-bottom: 12px;
    }

    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: var(--line-hi); }

    select.search { cursor: pointer; }

    /* ─────────────────────────────────────────────────────────────
       FILTER PILLS
    ───────────────────────────────────────────────────────────── */
    .pills {
      display: flex;
      gap: 5px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }

    .pill {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 3px 11px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s ease;
      font-family: var(--sans);
    }

    .pill:hover {
      border-color: var(--line-hi);
      color: var(--text);
    }

    .pill.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
      font-weight: 600;
    }

    /* ─────────────────────────────────────────────────────────────
       ROSTER LIST
    ───────────────────────────────────────────────────────────── */
    .roster-list {
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--faint) transparent;
    }

    .roster-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      padding: 10px 12px;
      background: var(--elevated);
      border: 1px solid var(--line);
      border-radius: var(--r);
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .roster-item:hover {
      border-color: var(--line-hi);
      background: #1F1F1F;
    }

    .roster-item:active { opacity: 0.75; }

    .item-name {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Role tag — mono, minimal */
    .role-tag {
      font-family: var(--mono);
      font-size: 0.60rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: var(--r);
    }

    .tag-vol {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .tag-stu {
      background: var(--red-dim);
      border: 1px solid var(--red-border);
      color: #F87171;
    }

    .item-action {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--faint);
    }

    .item-done {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--green);
    }

    /* ─────────────────────────────────────────────────────────────
       BUTTONS
    ───────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: var(--r);
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.13s ease, opacity 0.13s ease;
      border: none;
      letter-spacing: -0.01em;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
    }
    .btn-primary:hover { background: var(--red-hover); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--line-hi);
      color: var(--text);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); }

    /* Leader AI summary — use brand red, not rogue purple */
    .btn-ai {
      background: var(--elevated);
      border: 1px solid var(--line-hi);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      margin-top: 10px;
    }
    .btn-ai:hover { background: #212121; }

    .btn + .btn { margin-top: 8px; }

    /* ─────────────────────────────────────────────────────────────
       SUCCESS CONFIRMATION
    ───────────────────────────────────────────────────────────── */
    .success-box {
      text-align: center;
      padding: 32px 16px;
      animation: fadeUp 0.30s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .check-ring {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
    }

    .check-circle {
      stroke-dasharray: 157;
      stroke-dashoffset: 157;
      stroke-width: 2;
      stroke: var(--green);
      fill: none;
      animation: drawCircle 0.45s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .check-tick {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      stroke: var(--green);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: drawTick 0.28s cubic-bezier(0.65, 0, 0.45, 1) 0.28s forwards;
    }

    @keyframes drawCircle { to { stroke-dashoffset: 0; } }
    @keyframes drawTick   { to { stroke-dashoffset: 0; } }

    .success-name {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
    }

    .time-chip {
      display: inline-block;
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      color: var(--green);
      padding: 3px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: var(--mono);
      margin-bottom: 22px;
    }

    /* ─────────────────────────────────────────────────────────────
       ADD LINK
    ───────────────────────────────────────────────────────────── */
    .add-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.12s ease;
    }
    .add-link:hover { color: var(--text); }

    /* ─────────────────────────────────────────────────────────────
       TABS
    ───────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      min-height: 38px;
      padding: 7px 12px;
      background: transparent;
      border: none;
      border-radius: var(--r);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.80rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.13s ease;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      background: var(--elevated);
      color: var(--text);
      font-weight: 600;
      border: 1px solid var(--line);
    }

    /* ─────────────────────────────────────────────────────────────
       LEADER DASHBOARD
    ───────────────────────────────────────────────────────────── */
    .dash-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* PIN login block */
    .pin-block {
      background: var(--elevated);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px;
    }

    /* KPI grid — 2×2 */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }

    .kpi-cell {
      background: var(--elevated);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 12px;
      text-align: center;
    }

    .kpi-val {
      font-family: var(--mono);
      font-size: 1.55rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1;
      margin-bottom: 4px;
    }

    .kpi-val.accent { color: var(--red); }

    .kpi-label {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    /* Anomaly banner */
    .anomaly-banner {
      background: var(--risk-hi-bg);
      border: 1px solid var(--risk-hi-border);
      border-radius: var(--r);
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: var(--risk-hi-text);
    }

    .anomaly-banner p {
      margin-top: 3px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* Section label */
    .section-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    /* Risk list */
    .risk-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .risk-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: var(--elevated);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 10px 12px;
    }

    .risk-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .risk-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
    }

    .risk-badge {
      font-family: var(--mono);
      font-size: 0.60rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: var(--r);
    }

    .badge-high {
      background: var(--risk-hi-bg);
      border: 1px solid var(--risk-hi-border);
      color: var(--risk-hi-text);
    }

    .badge-mod {
      background: var(--risk-md-bg);
      border: 1px solid var(--risk-md-border);
      color: var(--risk-md-text);
    }

    .risk-reason {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* AI Summary box */
    .ai-summary {
      margin-top: 10px;
      background: var(--elevated);
      border: 1px solid var(--line-hi);
      border-radius: var(--r);
      padding: 14px;
      font-size: 0.80rem;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 24px 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

      <button class="tab-btn" id="tabLead" role="tab" aria-selected="false"
              onclick="switchTab('LEAD')">Leader View</button>
    </div>

    <!-- ── VOLUNTEER TAB ─────────────────────────────────────────── -->
    <section id="volPanel" role="region" aria-label="Volunteer check-in">

      <!-- Title + session status -->
      <div class="title-block">
        <h1 class="page-title">Volunteer Attendance</h1>

          <span class="chip-dot"></span>

        </span>

      <!-- Roster card -->
      <div class="card" id="volunteerMode">
        <input type="text" id="searchInput" class="search"
               placeholder="Search roster…" oninput="filterRoster()"
               aria-label="Search roster by name">

        <div class="pills" role="tablist" aria-label="Filter">
          <button class="pill active" id="pillAll" role="tab" aria-selected="true"
                  onclick="setFilter('ALL')">All (<span id="cntAll">0</span>)</button>

        <div class="roster-list" id="rosterList" role="list">
          <div class="empty">Loading roster…</div>
        </div>

        <a href="#" class="add-link" onclick="showNewPersonForm(); return false;"

      <!-- Success confirmation -->
      <div class="card" id="successMode" style="display:none;"
           role="dialog" aria-modal="true" aria-label="Check-in confirmed">
        <div class="success-box">

            <svg viewBox="0 0 52 52" aria-hidden="true">
              <circle class="check-circle" cx="26" cy="26" r="25"/>

          <div class="success-name" id="successName">Checked In</div>

          <button class="btn btn-primary" onclick="resetCheckIn()">Done — Next Check-In</button>

        <button class="btn btn-ghost" onclick="cancelNewPerson()">Back</button>

    </section>

    <!-- ── LEADER TAB ─────────────────────────────────────────────── -->
    <section id="leadPanel" style="display:none;" role="region" aria-label="Leader dashboard">

      <div class="card">
        <p class="dash-title">Centre Dashboard</p>

        <!-- PIN login -->
        <div class="pin-block" id="leaderPinSection">

                 placeholder="Leader PIN" style="margin-bottom:8px;">
          <button class="btn btn-primary" onclick="loadLeaderData()">Access Dashboard</button>
        </div>

        <!-- Dashboard content (hidden until PIN ok) -->
        <div id="leaderContent" style="display:none;">

          <!-- Anomaly banner (injected if needed) -->
          <div id="anomalyContainer" role="status" aria-live="polite"></div>

          <!-- KPI grid -->
          <div class="kpi-grid">
            <div class="kpi-cell">
              <div class="kpi-val" id="kpiCheckedIn">0</div>

            <div class="kpi-cell">
              <div class="kpi-val" id="kpiTotalVols">0</div>
              <div class="kpi-label">Active Roster</div>

              <div class="kpi-label">Turnout</div>
            </div>

              <div class="kpi-label">At Risk</div>
            </div>

          <!-- Attrition watchlist -->
          <div class="section-label">Attrition Watchlist</div>

          <!-- AI session summary -->
          <div class="section-label">Session Summary</div>
          <button class="btn btn-ai" onclick="generateGeminiSummary()">
            Generate Executive Summary
          </button>
          <div id="aiSummaryBox" style="display:none;">
            <div class="ai-summary" id="aiSummaryContent"></div>
            <button id="copyAiBtn" class="btn btn-ghost" onclick="copyAiSummary()"
                    style="margin-top:8px; font-size:0.78rem;">Copy to Clipboard</button>
          </div>

        </div>
      </div>

  </div><!-- /wrap -->

  <script>
    /* ─────────────────────────────────────────────────────────────
       STATE
    ───────────────────────────────────────────────────────────── */
    let gData = null;
    let currentFilter = 'ALL';
    let lastAiText = '';

    /* ─────────────────────────────────────────────────────────────
       CLOCK
    ───────────────────────────────────────────────────────────── */
    (function tickClock() {
      const el = document.getElementById('liveClock');
      function update() {
        const now = new Date();
        const d = now.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
        const t = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });
        el.textContent = d + '  ' + t;
      }
      update();
      setInterval(update, 1000);
    })();

    /* ─────────────────────────────────────────────────────────────
       TAB SWITCH
    ───────────────────────────────────────────────────────────── */
    function switchTab(tab) {
      const isVol = tab === 'VOL';
      document.getElementById('tabVol').className  = 'tab-btn' + (isVol ? ' active' : '');
      document.getElementById('tabLead').className = 'tab-btn' + (!isVol ? ' active' : '');
      document.getElementById('tabVol').setAttribute('aria-selected', isVol);
      document.getElementById('tabLead').setAttribute('aria-selected', !isVol);
      document.getElementById('volPanel').style.display  = isVol ? 'block' : 'none';
      document.getElementById('leadPanel').style.display = !isVol ? 'block' : 'none';
    }

    /* ─────────────────────────────────────────────────────────────
       COUNTER ANIMATION
    ───────────────────────────────────────────────────────────── */
    function animateCounter(id, target, suffix) {
      suffix = suffix || '';
      const el = document.getElementById(id);
      if (!el) return;
      const n = parseFloat(target) || 0;
      const dur = 550;
      let t0 = null;
      function step(ts) {
        if (!t0) t0 = ts;
        const p = Math.min((ts - t0) / dur, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(n * ease) + suffix;
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = n + suffix;
      }
      requestAnimationFrame(step);
    }

    /* ─────────────────────────────────────────────────────────────
       INITIAL DATA LOAD
    ───────────────────────────────────────────────────────────── */
    window.onload = function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(onDataLoaded).getInitialData();
      } else {
        // Development preview stub
        onDataLoaded({
          todayDate: new Date().toLocaleDateString(),
          session: { isOpen: true, startTime: '16:00', endTime: '18:00' },
          checkedInIds: ['p1'],
          roster: [
            { id: 'p1', name: 'Gomesh',       role: 'VOLUNTEER' },
            { id: 'p2', name: 'Aarav Sharma',  role: 'VOLUNTEER' },
            { id: 'p3', name: 'Priya Patel',   role: 'STUDENT'   },
            { id: 'p4', name: 'Rohan Kumar',   role: 'STUDENT'   },
            { id: 'p5', name: 'Neha Verma',    role: 'VOLUNTEER' }
          ]
        });
      }
    };

    function onDataLoaded(data) {
      gData = data;
      const badge = document.getElementById('sessionBadge');
      const label = document.getElementById('sessionLabel');

      if (data.session && data.session.isOpen) {
        badge.className = 'session-chip chip-open';
        label.textContent = 'Session Open · ' + data.session.startTime + '–' + data.session.endTime;
      } else if (data.session && data.session.isEarly) {
        badge.className = 'session-chip chip-closed';
        label.textContent = 'Opens at ' + (data.session.windowStartFormatted || data.session.startTime);
      } else {
        badge.className = 'session-chip chip-closed';
        label.textContent = 'Check-In Closed';
      }

      updateCounts();
      filterRoster();
    }

    /* ─────────────────────────────────────────────────────────────
       ROSTER FILTER + RENDER
    ───────────────────────────────────────────────────────────── */
    function updateCounts() {
      if (!gData || !gData.roster) return;
      const r = gData.roster;
      const ci = gData.checkedInIds || [];
      document.getElementById('cntAll').textContent     = r.length;
      document.getElementById('cntVol').textContent     = r.filter(p => p.role === 'VOLUNTEER').length;
      document.getElementById('cntStu').textContent     = r.filter(p => p.role === 'STUDENT').length;
      document.getElementById('cntChecked').textContent = r.filter(p => ci.includes(p.id)).length;
    }

    function setFilter(f) {
      currentFilter = f;
      ['pillAll','pillVol','pillStu','pillChecked'].forEach(id => {
        document.getElementById(id).classList.remove('active');
        document.getElementById(id).setAttribute('aria-selected', 'false');
      });
      const map = { ALL:'pillAll', VOLUNTEER:'pillVol', STUDENT:'pillStu', CHECKED_IN:'pillChecked' };
      const el = document.getElementById(map[f]);
      if (el) { el.classList.add('active'); el.setAttribute('aria-selected','true'); }
      filterRoster();
    }

    function filterRoster() {
      if (!gData || !gData.roster) return;
      const q = document.getElementById('searchInput').value.toLowerCase();
      let list = gData.roster;
      if (currentFilter === 'VOLUNTEER')  list = list.filter(p => p.role === 'VOLUNTEER');
      else if (currentFilter === 'STUDENT')   list = list.filter(p => p.role === 'STUDENT');
      else if (currentFilter === 'CHECKED_IN') list = list.filter(p => (gData.checkedInIds||[]).includes(p.id));
      if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
      renderRoster(list);
    }

    function renderRoster(list) {
      const el = document.getElementById('rosterList');
      if (!list || list.length === 0) {
        el.innerHTML = '<div class="empty">No matching members.</div>';
        return;
      }
      const ci = gData && gData.checkedInIds ? gData.checkedInIds : [];
      el.innerHTML = list.map(p => {
        const checked = ci.includes(p.id);
        const tagClass = p.role === 'STUDENT' ? 'tag-stu' : 'tag-vol';
        return `
          <div class="roster-item" role="listitem" onclick="doCheckIn('${p.id}')"
               tabindex="0" onkeydown="if(event.key==='Enter')doCheckIn('${p.id}')">
            <div>
              <span class="item-name">${p.name}</span>
              <span class="role-tag ${tagClass}" style="margin-left:6px;">${p.role}</span>
            </div>
            <div class="item-right">
              <span class="${checked ? 'item-done' : 'item-action'}">${checked ? 'Done' : 'Tap'}</span>
            </div>
          </div>`;
      }).join('');
    }

    /* ─────────────────────────────────────────────────────────────
       CHECK-IN
    ───────────────────────────────────────────────────────────── */
    function doCheckIn(personId) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });

      const showSuccess = (name, time) => {
        document.getElementById('volunteerMode').style.display = 'none';
        document.getElementById('successMode').style.display = 'block';
        document.getElementById('successName').textContent = name;
        document.getElementById('successTime').textContent = 'Checked in at ' + time;
        if (gData && gData.checkedInIds && !gData.checkedInIds.includes(personId)) {
          gData.checkedInIds.push(personId);
        }
        updateCounts();
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(res => {
          if (res.success) showSuccess(res.personName, res.time || timeStr);
          else alert(res.reason || 'Check-in failed.');
        }).checkIn(personId);
      } else {
        const p = gData.roster.find(r => r.id === personId);
        showSuccess(p ? p.name : 'Volunteer', timeStr);
      }
    }

    function resetCheckIn() {
      document.getElementById('successMode').style.display = 'none';
      document.getElementById('volunteerMode').style.display = 'block';
      document.getElementById('searchInput').value = '';
      setFilter('ALL');
    }

    /* ─────────────────────────────────────────────────────────────
       NEW PERSON
    ───────────────────────────────────────────────────────────── */
    function showNewPersonForm() {
      document.getElementById('volunteerMode').style.display = 'none';
      document.getElementById('newPersonMode').style.display = 'block';
    }

    function cancelNewPerson() {
      document.getElementById('newPersonMode').style.display = 'none';
      document.getElementById('volunteerMode').style.display = 'block';
    }

    function submitNewPerson() {
      const name = document.getElementById('newNameInput').value.trim();
      const role = document.getElementById('newRoleSelect').value;
      if (!name) { alert('Please enter your name.'); return; }
      const timeStr = new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(res => {
          if (res.success) {
            document.getElementById('newPersonMode').style.display = 'none';
            document.getElementById('successMode').style.display = 'block';
            document.getElementById('successName').textContent = res.personName;
            document.getElementById('successTime').textContent = 'Added & checked in at ' + (res.time || timeStr);
          } else { alert(res.reason); }
        }).registerNewPerson(name, role);
      } else {
        const newId = 'p_' + Date.now();
        gData.roster.push({ id: newId, name, role });
        (gData.checkedInIds = gData.checkedInIds || []).push(newId);
        document.getElementById('newPersonMode').style.display = 'none';
        document.getElementById('successMode').style.display = 'block';
        document.getElementById('successName').textContent = name;
        document.getElementById('successTime').textContent = 'Added & checked in at ' + timeStr;
        updateCounts();
      }
    }

    /* ─────────────────────────────────────────────────────────────
       LEADER DASHBOARD
    ───────────────────────────────────────────────────────────── */
    function loadLeaderData() {
      const pin = document.getElementById('pinInput').value;

      const render = (stats, anomaly, atRisks) => {
        document.getElementById('leaderPinSection').style.display = 'none';
        document.getElementById('leaderContent').style.display = 'block';

        animateCounter('kpiCheckedIn',  stats.todayCheckedIn || 0);
        animateCounter('kpiTotalVols',  stats.totalVolunteers || 0);
        animateCounter('kpiTurnoutPct', stats.turnOutPct || 0, '%');
        animateCounter('kpiAtRisk',     atRisks ? atRisks.length : 0);

        const turnPct = stats.turnOutPct ?? 0;
        const isLow = turnPct < 60 || (anomaly && anomaly.isAnomaly);
        const aEl = document.getElementById('anomalyContainer');
        if (isLow) {
          aEl.innerHTML = `
            <div class="anomaly-banner">
              <strong>Low Turnout — ${turnPct}% (below 60% threshold)</strong>
              <p>Coordinator review recommended before session ends.</p>
            </div>`;
        } else {
          aEl.innerHTML = '';
        }

        const rEl = document.getElementById('riskList');
        if (!atRisks || atRisks.length === 0) {
          rEl.innerHTML = '<div class="empty" style="color:var(--green); padding:12px 0;">All volunteers within healthy attendance range.</div>';
        } else {
          rEl.innerHTML = atRisks.map(item => {
            const hi = (item.consecutiveAbsences || 0) >= 3 ||
                       (item.riskReason && item.riskReason.toUpperCase().includes('HIGH'));
            return `
              <div class="risk-item">
                <div class="risk-row">
                  <span class="risk-name">${item.name}</span>
                  <span class="risk-badge ${hi ? 'badge-high' : 'badge-mod'}">${hi ? 'High' : 'Moderate'}</span>
                </div>
                <div class="risk-reason">${item.riskReason || 'Attendance below threshold'}</div>
              </div>`;
          }).join('');
        }
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(res => {
          if (res.success) render(res.stats, res.anomalyAlert, res.atRiskList);
          else alert(res.reason);
        }).getLeaderDashboard(pin);
      } else {
        render(
          { todayCheckedIn: 6, totalVolunteers: 12, turnOutPct: 54 },
          { isAnomaly: true },
          [
            { name: 'Aarav Sharma', riskReason: 'Missed 3 consecutive sessions' },
            { name: 'Neha Verma',   riskReason: 'Attendance dropped 35% over 4 weeks' }
          ]
        );
      }
    }

    /* ─────────────────────────────────────────────────────────────
       GEMINI EXECUTIVE SUMMARY
    ───────────────────────────────────────────────────────────── */
    function generateGeminiSummary() {
      const pin = document.getElementById('pinInput').value;
      const box = document.getElementById('aiSummaryBox');
      const content = document.getElementById('aiSummaryContent');
      box.style.display = 'block';
      content.textContent = 'Generating summary…';

      const renderSummary = text => {
        lastAiText = text;
        content.textContent = text;
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(res => {
          if (res.success) renderSummary(res.aiSummary);
          else renderSummary('Notice: ' + res.reason);
        }).generateGeminiExecutiveSummary(pin);
      } else {
        renderSummary(
`Engagement Overview:
— Vihana Centre is operating with 12 active volunteers and 45 students.
— Today's turnout: 6/12 (54%) — below target threshold.

Retention Watchlist:
— 2 volunteers flagged for attendance pattern concerns.
— Recommend personal outreach before next session.

Action Items:
— Follow up with flagged volunteers by end of week.
— Review session schedule for recurring low-turnout slots.`
        );
      }
    }

    function copyAiSummary() {
      if (!lastAiText) return;
      navigator.clipboard.writeText(lastAiText).then(() => {
        const btn = document.getElementById('copyAiBtn');
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = 'Copy to Clipboard'; }, 2000);
      });
    }
  </script>
</body>
</html>
